<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>메뉴판 만들기</title>
<meta name="theme-color" content="#1F7A78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="메뉴판">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Brush+Script&family=Song+Myung&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#F3EFE6; --surface:#FFFFFF; --surface-2:#FAF8F3; --text:#25292E; --muted:#5F666E;
  --line:rgba(37,41,46,.14); --accent:#1F7A78; --accent-ink:#FFFFFF; --accent-soft:#DCEEEA;
  --focus:rgba(31,122,120,.30); --shadow:0 1px 2px rgba(37,41,46,.06),0 14px 36px rgba(37,41,46,.12);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15181B; --surface:#1E2226; --surface-2:#252A2F; --text:#ECEAE4; --muted:#A4AAB0;
    --line:rgba(255,255,255,.12); --accent:#43AAA6; --accent-ink:#0C1818; --accent-soft:#1F3634;
    --focus:rgba(67,170,166,.38); --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 36px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15181B; --surface:#1E2226; --surface-2:#252A2F; --text:#ECEAE4; --muted:#A4AAB0;
  --line:rgba(255,255,255,.12); --accent:#43AAA6; --accent-ink:#0C1818; --accent-soft:#1F3634;
  --focus:rgba(67,170,166,.38); --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 36px rgba(0,0,0,.4);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Gowun Dodum',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word}
.top{max-width:1180px;margin:0 auto;padding:28px 20px 4px}
.top h1{font-family:'Song Myung',serif;font-weight:400;font-size:clamp(30px,5vw,40px);line-height:1.2;margin:0}
.top p{margin:6px 0 0;color:var(--muted);font-size:16px}
.app{max-width:1180px;margin:0 auto;padding:16px 20px 32px;display:grid;gap:22px}
.preview{order:-1;min-width:0}
@media (min-width:920px){
  .app{grid-template-columns:minmax(360px,440px) minmax(0,1fr);gap:36px;align-items:start}
  .preview{order:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px)}
}
.sheet{width:100%;max-width:620px;margin:0 auto;aspect-ratio:1240/1754;background:#F5F8FC;border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.sheet canvas,.sheet img{display:block;width:100%;height:100%}
.sheet img{-webkit-touch-callout:default}
.preview-note{max-width:620px;margin:10px auto 0;text-align:center;font-size:14px;color:var(--muted);min-height:1.5em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 20px 0;display:flex;flex-direction:column;gap:20px;min-width:0}
.field{display:flex;flex-direction:column;gap:8px;margin:0}
.label-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.label{font-size:17px;color:var(--text)}
.hint{font-size:14px;color:var(--muted);text-align:right}
.label-row .label{flex-shrink:0}
input,textarea{font:inherit;font-size:18px;line-height:1.6;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;max-width:100%}
textarea{resize:vertical;overflow:hidden}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--focus)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:15px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.pair{display:grid;gap:10px}
details{border-top:1px solid var(--line);padding-top:16px}
summary{cursor:pointer;color:var(--muted);font-size:16px;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:'';width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details[open] summary::before{transform:rotate(45deg)}
.more{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.size-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stepper{display:flex;align-items:center;gap:6px}
.step{font:inherit;font-size:22px;line-height:1;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);cursor:pointer}
.step:disabled{opacity:.4;cursor:default}
.stepper output{min-width:60px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.linkbtn{align-self:flex-start;font:inherit;font-size:15px;color:var(--muted);background:none;border:none;padding:4px 0;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.actions{position:sticky;bottom:0;z-index:5;margin:0 -20px;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 18px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions.single{grid-template-columns:1fr}
.actions.static{position:static}
.btn{font:inherit;font-size:17px;line-height:1.3;min-height:52px;border-radius:14px;border:1px solid transparent;cursor:pointer;padding:0 14px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-secondary{background:transparent;color:var(--text);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.status{grid-column:1/-1;margin:0;font-size:14px;color:var(--muted);min-height:1.5em;text-align:center}
.fallback{grid-column:1/-1;margin:0;font-size:15px;color:var(--text);background:var(--accent-soft);border-radius:12px;padding:12px 14px}
[hidden]{display:none !important}
</style>
</head>
<body>
<header class="top">
  <h1>메뉴판 만들기</h1>
  <p>메뉴 이름만 바꾸면 A4 메뉴판이 바로 만들어져요. 입력한 내용은 이 휴대폰(브라우저)에 저장돼서 다음에 열어도 그대로 남아 있어요.</p>
</header>

<main class="app">
  <section class="panel" aria-label="메뉴 입력">
    <div class="field">
      <label class="label" for="f-title">제목</label>
      <input id="f-title" autocomplete="off">
      <div class="chips" role="group" aria-label="제목 빠른 선택">
        <button type="button" class="chip" data-title="오늘의 중식">오늘의 중식</button>
        <button type="button" class="chip" data-title="오늘의 석식">오늘의 석식</button>
      </div>
    </div>

    <div class="field">
      <div class="label-row"><label class="label" for="f-mains">메인 메뉴</label><span class="hint">한 줄에 하나씩</span></div>
      <textarea id="f-mains" rows="2" spellcheck="false"></textarea>
    </div>

    <div class="field">
      <div class="label-row"><label class="label" for="f-sides">밥과 반찬</label><span class="hint">한 줄에 하나씩 · 두 단으로 나눠 배치</span></div>
      <textarea id="f-sides" rows="8" spellcheck="false"></textarea>
    </div>

    <div class="field">
      <div class="label-row"><label class="label" for="f-soup">뚝배기 (국)</label><span class="hint">한 줄에 하나씩</span></div>
      <div class="pair">
        <textarea id="f-soup" rows="1" spellcheck="false"></textarea>
        <input id="f-soupSub" autocomplete="off" aria-label="국 아래 설명 문구" placeholder="국 아래 설명 (비우면 안 나와요)">
      </div>
    </div>

    <div class="field">
      <div class="label-row"><label class="label" for="f-salad">샐러드바 안내</label><span class="hint">20자 안팎 · 비우면 안 나와요</span></div>
      <input id="f-salad" autocomplete="off">
    </div>

    <details>
      <summary>글씨 크기</summary>
      <div class="more" id="size-list">
        <button type="button" class="linkbtn" id="size-reset">모두 보통(100%)으로</button>
      </div>
    </details>

    <details>
      <summary>문구 바꾸기</summary>
      <div class="more">
        <div class="field">
          <div class="label-row"><label class="label" for="f-greet">제목 아래 날짜</label><span class="hint">‘○월 ○일 ○요일’ 모양이면 매일 바뀌어요</span></div>
          <input id="f-greet" autocomplete="off">
          <button type="button" class="linkbtn" id="today">오늘 날짜로 되돌리기</button>
        </div>
        <div class="field"><label class="label" for="f-mainsTitle">메인 칸 이름</label><input id="f-mainsTitle" autocomplete="off"></div>
        <div class="field"><label class="label" for="f-sidesTitle">반찬 칸 이름</label><input id="f-sidesTitle" autocomplete="off"></div>
        <div class="field"><label class="label" for="f-soupTitle">뚝배기 칸 이름</label><input id="f-soupTitle" autocomplete="off"></div>
        <div class="field"><label class="label" for="f-closing">맨 아래 인사말</label><input id="f-closing" autocomplete="off" placeholder="비우면 안 나와요"></div>
        <button type="button" class="linkbtn" id="reset">예시 메뉴로 되돌리기</button>
      </div>
    </details>

    <div class="actions" id="actions">
      <button type="button" class="btn btn-primary" id="save-png">이미지 저장</button>
      <button type="button" class="btn btn-secondary" id="save-pdf">인쇄용 PDF</button>
      <p class="fallback" id="share-hint" hidden>공유 창에서 카카오톡을 고르면 바로 보낼 수 있어요. 아이폰은 ‘이미지 저장’을 누르면 사진첩에 저장돼요.</p>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
  </section>

  <section class="preview" aria-label="미리보기">
    <div class="sheet">
      <canvas id="pv" width="1240" height="1754" aria-label="메뉴판 미리보기"></canvas>
    </div>
    <p class="preview-note" id="note"></p>
  </section>
</main>

<script>
(() => {
  // ---------- 상태 ----------
  const today = () => { const n = new Date(); return `${n.getMonth() + 1}월 ${n.getDate()}일 ${'일월화수목금토'[n.getDay()]}요일`; };
  const DATE_RE = /^(\d{1,2})월 (\d{1,2})일 [일월화수목금토]요일$/;
  // 'N월 N일 X요일' 이 오늘보다 앞이면 true (연말·연초는 가까운 쪽 해로 봄)
  const staleDate = t => {
    const m = DATE_RE.exec(String(t || '').trim()); if (!m) return false;
    const n = new Date(), t0 = new Date(n.getFullYear(), n.getMonth(), n.getDate()), d = new Date(n.getFullYear(), m[1] - 1, +m[2]);
    const diff = (d - t0)/864e5;
    if (diff > 182) d.setFullYear(d.getFullYear() - 1); else if (diff < -182) d.setFullYear(d.getFullYear() + 1);
    return d < t0;
  };
  const DEFAULTS = {
    title: '오늘의 중식',
    greet: today(),
    mainsTitle: '메인 요리',
    mains: '간장돼지불고기\n소시지볶음',
    sidesTitle: '밥과 반찬',
    sides: '쌀밥\n흑미밥\n열무김치\n땅콩자반\n총알버섯햄볶음\n멸치볶음\n청경채무침\n숙주나물',
    soupTitle: '오늘의 뚝배기',
    soup: '황태해장국',
    soupSub: '뜨끈하게 끓여 냈어요',
    salad: '샐러드바도 자유롭게 이용하세요',
    closing: ''
  };
  // 칸별 글씨 크기 (%): 70~150, 10씩
  const SIZES = [['title', '제목'], ['mains', '메인 메뉴'], ['sides', '밥과 반찬'], ['soup', '뚝배기'], ['salad', '샐러드바']];
  const SZ_MIN = 70, SZ_MAX = 150, SZ_STEP = 10;
  const sizeOf = v => { const n = Math.round(Number(v)/SZ_STEP)*SZ_STEP; return n >= SZ_MIN && n <= SZ_MAX ? n : 100; };
  // 예전 기본 문구(사투리·추천)를 그대로 쓰던 폰은 새 기본값으로 바꿔 줌. 기본값을 또 바꾸면 예전 값을 배열에 더할 것
  const OLD = { greet: ['혼저옵서예'], closing: ['하영 드십서예'], mainsTitle: ['오늘의 추천'], soupSub: ['뜨끈한 뚝배기에 담아 드려요'] };
  const KEY = 'jeju-menu-v1';
  const load = () => {
    let s = Object.assign({}, DEFAULTS);
    try { const raw = localStorage.getItem(KEY); if (raw) s = Object.assign(s, JSON.parse(raw)); } catch (e) {}
    for (const k in OLD) if (OLD[k].includes(s[k])) s[k] = DEFAULTS[k];
    if (staleDate(s.greet)) s.greet = today();
    const sz = s.size && typeof s.size === 'object' ? s.size : {};
    s.size = {}; SIZES.forEach(([k]) => { s.size[k] = sizeOf(sz[k]); });
    return s;
  };
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
  let state = load();

  const $ = id => document.getElementById(id);
  const FIELDS = Object.keys(DEFAULTS);
  const areas = [];
  const autoGrow = el => { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; };

  FIELDS.forEach(k => {
    const el = $('f-' + k);
    el.value = state[k];
    if (el.tagName === 'TEXTAREA') areas.push(el);
    el.addEventListener('input', () => {
      state[k] = el.value;
      if (el.tagName === 'TEXTAREA') autoGrow(el);
      onChange();
    });
  });

  const chips = [...document.querySelectorAll('.chip[data-title]')];
  const syncChips = () => chips.forEach(c => c.setAttribute('aria-pressed', String(state.title.trim() === c.dataset.title)));
  chips.forEach(c => c.addEventListener('click', () => {
    state.title = c.dataset.title; $('f-title').value = state.title; onChange();
  }));

  const resetBtn = $('reset');
  let resetArmed = null;
  resetBtn.addEventListener('click', () => {
    if (!resetArmed) {
      resetBtn.textContent = '한 번 더 누르면 예시로 되돌려요';
      resetArmed = setTimeout(() => { resetArmed = null; resetBtn.textContent = '예시 메뉴로 되돌리기'; }, 3000);
      return;
    }
    clearTimeout(resetArmed); resetArmed = null; resetBtn.textContent = '예시 메뉴로 되돌리기';
    state = Object.assign({}, DEFAULTS, { greet: today(), size: state.size });   // 글씨 크기는 그대로 둠
    FIELDS.forEach(k => { $('f-' + k).value = state[k]; });
    areas.forEach(autoGrow);
    onChange();
  });

  // 글씨 크기 − / +
  const sizeList = $('size-list'), sizeOut = {};
  const syncSizes = () => SIZES.forEach(([k]) => {
    const v = state.size[k], o = sizeOut[k];
    o.out.textContent = v + '%'; o.dn.disabled = v <= SZ_MIN; o.up.disabled = v >= SZ_MAX;
  });
  SIZES.forEach(([k, name]) => {
    const row = document.createElement('div'); row.className = 'size-row';
    row.innerHTML = `<span class="label">${name}</span><div class="stepper"><button type="button" class="step" aria-label="${name} 글씨 작게">−</button><output aria-live="polite"></output><button type="button" class="step" aria-label="${name} 글씨 크게">+</button></div>`;
    const [dn, up] = row.querySelectorAll('button');
    sizeOut[k] = { out: row.querySelector('output'), dn, up };
    dn.addEventListener('click', () => { state.size[k] = sizeOf(state.size[k] - SZ_STEP); syncSizes(); onChange(); });
    up.addEventListener('click', () => { state.size[k] = sizeOf(state.size[k] + SZ_STEP); syncSizes(); onChange(); });
    sizeList.insertBefore(row, $('size-reset'));
  });
  $('size-reset').addEventListener('click', () => { SIZES.forEach(([k]) => { state.size[k] = 100; }); syncSizes(); onChange(); });

  $('today').addEventListener('click', () => {
    state.greet = today(); $('f-greet').value = state.greet; onChange();
  });

  const lines = s => String(s || '').split(/[\n,]/).map(t => t.trim()).filter(Boolean);
  const model = () => ({
    title: state.title.trim(), greet: state.greet.trim(),
    mainsTitle: state.mainsTitle.trim(), mains: lines(state.mains),
    sidesTitle: state.sidesTitle.trim(), sides: lines(state.sides),
    soupTitle: state.soupTitle.trim(), soups: lines(state.soup), soupSub: state.soupSub.trim(),
    salad: state.salad.trim(), closing: state.closing.trim(),
    fs: Object.fromEntries(SIZES.map(([k]) => [k, state.size[k]/100]))
  });

  // ---------- 메뉴판 그리기 (A4: 1240 x 1754 기준 단위) ----------
  const C = {
    paper:'#F5F8FC', fiber:'#C7D2DF', ink:'#23262B', muted:'#636A73', stroke:'#4A4F57',
    seal:'#B5372B', sealInk:'#FBF3EA', hair:'rgba(35,38,43,0.24)',
    card:'#FFFFFF', cardLine:'rgba(35,38,43,0.20)', shade:'rgba(40,62,96,0.10)', sun:'#C8503A'
  };
  const INK = a => `rgba(35,38,43,${a})`, GLOW = a => `rgba(248,250,253,${a})`;
  const W = 1240, H = 1754;
  const FO = 48, FI = 56;                       // 바깥·안쪽 테두리 선 위치
  const IX = FI + 1, IY = FI + 1, IW = W - 2*IX, IH = H - 2*IY;
  const BAND_H = 196, BAND_Y = IY + IH - BAND_H;
  const CX0 = 152, CW = W - 2*CX0;
  const CT = IY + 40, CB = BAND_Y - 10, CH = CB - CT;   // 아래는 해(붉은 원)에 닿지 않게
  const POT_CW = 240, POT_CH = 224, POT_W = 200, POT_H = POT_W*POT_CH/POT_CW;   // 뚝배기 캐시 크기 · 그릴 크기
  const PAD_X = 36;                                // 카드 안 좌우 여백
  const SALAD = '샐러드바', SALAD_RE = /샐러드(\s*바)?/, SI = 60, SIG = 16, SS = 36, SL = 48, SLH = 46;   // 샐러드바 줄: 아이콘 폭·간격, 글씨, 줄 높이·간격
  const SONG = s => `${s}px "Song Myung", "Nanum Myeongjo", serif`;
  const BRUSH = s => `${s}px "Nanum Brush Script", "Song Myung", serif`;
  const BAT7 = s => `700 ${s}px "Gowun Batang", "Nanum Myeongjo", serif`;
  const BAT4 = s => `400 ${s}px "Gowun Batang", "Nanum Myeongjo", serif`;

  const spacedWidth = (c, t, sp) => { const ch = [...t]; let w = 0; for (const x of ch) w += c.measureText(x).width; return w + sp * Math.max(0, ch.length - 1); };
  const drawSpaced = (c, t, x, y, sp, align = 'center', stroke = 0) => {
    const total = spacedWidth(c, t, sp);
    let cx = align === 'center' ? x - total/2 : x;
    c.textAlign = 'left';
    if (stroke) { c.lineWidth = stroke; c.lineJoin = 'round'; c.strokeStyle = c.fillStyle; }
    for (const ch of [...t]) { if (stroke) c.strokeText(ch, cx, y); c.fillText(ch, cx, y); cx += c.measureText(ch).width + sp; }
    return total;
  };
  const fit = (c, font, size, t, spEm, maxW) => {
    c.font = font(size);
    const w = spacedWidth(c, t, size*spEm);
    const s = w > maxW ? size * maxW / w : size;
    c.font = font(s);
    return s;
  };
  const rr = (c, x, y, w, h, r) => {

    const b = [], fs = d.fs;
    const tf = d.title ? titleF(c, d) : 1;
    const head = (d.title ? 212*tf : 0) + (d.greet ? 52 : 0);
    if (head) b.push({ t: 'head', h: head, tf });
    const secT = t => t ? 70 : 0;
    if (d.mains.length) b.push({ t: 'mains', h: secT(d.mainsTitle) + d.mains.length*89*fs.mains + (d.mains.length - 1)*12 });
    if (d.sides.length) {
      const cols = d.sides.length > 1 ? 2 : 1, rows = Math.ceil(d.sides.length / cols);
      b.push({ t: 'sides', h: secT(d.sidesTitle) + rows*54*fs.sides + (rows - 1)*18, cols, rows });
    }
    if (d.soups.length) {
      // 국 이름이 56px 아래로 줄어들 만큼 길면 두 줄 (이어지는 줄은 78 간격)
      const f = fs.soup, avail = CW - 2*PAD_X - POT_W - 34;
      const names = d.soups.map(t => widthAt(c, SONG, 74*f, t, .02)*56/74 > avail ? split2(t) : [t]);
      const th = names.reduce((s, x) => s + (85 + (x.length - 1)*78)*f, 0) + (names.length - 1)*4 + (d.soupSub ? 53*f : 0);
      const up = Math.max(POT_H + 28, th + 48);               // 뚝배기 위아래 14, 글 위아래 24
      b.push({ t: 'soup', h: secT(d.soupTitle) + up, up, th, names });
    }
    if (d.salad) { const sl = saladLines(d, wrap); b.push({ t: 'salad', h: sl.h, sl }); }   // 뚝배기 카드와 나눈 따로 한 줄
    if (d.closing) b.push({ t: 'closing', h: 53 });
    return b;
  }

  function secTitle(c, text, y, k) {
    const s = fit(c, SONG, 42*k, text, .22, CW*.6);
    const sp = s*.22, tw = spacedWidth(c, text, sp), cy = y + 23*k;
    c.fillStyle = C.seal; drawSpaced(c, text, W/2, cy, sp, 'center', s*.02);
    c.fillStyle = C.stroke;
    const g = 30*k, len = 150*k, l = W/2 - tw/2 - g, r = W/2 + tw/2 + g;
    brushLine(c, l - len, l, cy + 2*k, 7*k);
    c.save(); c.translate(2*W/2, 0); c.scale(-1, 1); brushLine(c, W - r - len, W - r, cy + 2*k, 7*k); c.restore();
  }

  function draw(c, scale, d) {
    if (!PAPER) PAPER = makePaper();
    if (!BAND) BAND = makeBand();
    if (!POT) POT = makePot();
    if (!SALAD_IC) SALAD_IC = makeSalad();
    c.setTransform(scale, 0, 0, scale, 0, 0);
    c.lineJoin = 'miter'; c.lineCap = 'butt';
    c.textBaseline = 'middle';
    c.drawImage(PAPER, 0, 0, W, H);
    c.drawImage(BAND, IX, BAND_Y, IW, BAND_H);
    c.strokeStyle = C.ink;
    c.lineWidth = 2.6; c.strokeRect(FO, FO, W - 2*FO, H - 2*FO);
    c.lineWidth = 1.4; c.strokeRect(FI, FI, W - 2*FI, H - 2*FI);

    let blocks = blocksOf(d, c);
    const n = blocks.length, G = n - 1;
    if (!n) return { k: 1 };
    const kOf = bs => Math.min(1, (CH - G*28) / bs.reduce((s, b) => s + b.h, 0));
    let k = kOf(blocks);
    // 샐러드바 문구가 한 줄로는 다른 글씨보다 눈에 띄게 작아질 때만 두 줄로
    const sb = blocks.find(b => b.sl);
    if (sb && SS*(CW - (SI*sb.sl.f + SIG)*k)/sb.sl.w < 34*sb.sl.f*k) { blocks = blocksOf(d, c, true); k = kOf(blocks); }
    const T1 = blocks.reduce((s, b) => s + b.h, 0);
    // 남는 자리는 먼저 위아래 여백 22씩(제목·해 숨 쉴 자리), 그다음 블록 사이 간격으로
    const free = CH - k*T1;
    const gap = G ? Math.min(60, Math.max(28, (free - 44) / G)) : 0;
    let y = CT + Math.max(0, (free - G*gap) / 2);

    blocks.forEach((b, i) => { if (i) y += gap;
      let yy = y;
      if (b.t === 'head') {
        if (d.title) {
          const tf = b.tf, sealS = sealOf(tf)*k, sg = 18*k;
          const s = fit(c, BRUSH, 236*tf*k, d.title, .03, CW - 2*(sealS + sg));
          c.fillStyle = C.ink;
          const tw = drawSpaced(c, d.title, W/2, yy + 104*tf*k, s*.03, 'center', s*.024);
          seal(c, W/2 + tw/2 + sg + sealS/2, yy + 126*tf*k, sealS);
          yy += 212*tf*k;
        }
        if (d.greet) {
          const s = fit(c, BAT4, 30*k, d.greet, .3, CW*.8);
          c.fillStyle = C.muted; drawSpaced(c, d.greet, W/2, yy + 28*k, s*.3);
        }
      } else if (b.t === 'mains') {
        if (d.mainsTitle) { secTitle(c, d.mainsTitle, yy, k); yy += 70*k; }
        const f = d.fs.mains;
        for (const m of d.mains) {
          const s = fit(c, SONG, 78*f*k, m, .02, CW);
          c.fillStyle = C.ink; drawSpaced(c, m, W/2, yy + 44.5*f*k, s*.02, 'center', s*.018);
          yy += (89*f + 12)*k;
        }
      } else if (b.t === 'sides') {
        if (d.sidesTitle) { secTitle(c, d.sidesTitle, yy, k); yy += 70*k; }
        const two = b.cols === 2, colW = two ? (CW - 1.5)/2 : CW, f = d.fs.sides;
        if (two) {   // 가운데 붓선 (양 끝이 가늘게)
          const len = (b.rows*54*f + (b.rows - 1)*18)*k;
          c.save(); c.translate(CX0 + colW + .75, yy); c.rotate(Math.PI/2);
          c.fillStyle = C.hair; brushLine(c, 0, len, 0, 3.2); c.restore();
        }
        d.sides.forEach((t, i) => {
          const col = two ? i % 2 : 0, row = two ? Math.floor(i/2) : i;
          const cx = two ? (col === 0 ? CX0 + colW/2 : CX0 + colW + 1.5 + colW/2) : W/2;
          fit(c, BAT7, 40*f*k, t, 0, colW - 24);
          c.fillStyle = C.ink; drawSpaced(c, t, cx, yy + (row*(54*f + 18) + 27*f)*k, 0);
        });
      } else if (b.t === 'soup') {
        if (d.soupTitle) { secTitle(c, d.soupTitle, yy, k); yy += 70*k; }
        // 흰 카드: 아래로 살짝 비낀 그림자 + 가는 테두리 + 가운데 짧은 붉은 선
        const ph = b.up*k, r = 4*k;
        rr(c, CX0, yy + 4*k, CW, ph, r); c.fillStyle = C.shade; c.fill();
        rr(c, CX0, yy, CW, ph, r); c.fillStyle = C.card; c.fill();
        c.strokeStyle = C.cardLine; c.lineWidth = 1.5; c.stroke();
        c.fillStyle = C.seal; c.fillRect(W/2 - 60*k, yy, 120*k, 5*k);
        const potW = POT_W*k, potH = POT_H*k, g = 34*k, innerX = CX0 + PAD_X*k, innerW = CW - 2*PAD_X*k;
        const avail = innerW - potW - g;
        const f = d.fs.soup;
        const names = b.names.map(ls => {
          let s = 74*f*k; ls.forEach(t => { s = Math.min(s, fit(c, SONG, 74*f*k, t, .02, avail)); });
          c.font = SONG(s); return { ls, s, w: Math.max(...ls.map(t => spacedWidth(c, t, s*.02))) };
        });
        let sub = null;
        if (d.soupSub) { const s = fit(c, BAT4, 32*f*k, d.soupSub, 0, avail); sub = { t: d.soupSub, s, w: spacedWidth(c, d.soupSub, 0) }; }
        const textW = Math.max(sub ? sub.w : 0, ...names.map(x => x.w));
        const gx = innerX + (innerW - (potW + g + textW))/2, inH = b.up*k;
        c.drawImage(POT, gx, yy + (inH - potH)/2, potW, potH);
        const tx = gx + potW + g;
        let ty = yy + (inH - b.th*k)/2;
        names.forEach(x => {
          c.font = SONG(x.s); c.fillStyle = C.ink;
          x.ls.forEach((t, j) => { drawSpaced(c, t, tx, ty + 42.5*f*k, x.s*.02, 'left', x.s*.018); ty += (j < x.ls.length - 1 ? 78*f : 85*f + 4)*k; });
        });
        if (sub) { c.font = BAT4(sub.s); c.fillStyle = C.muted; drawSpaced(c, sub.t, tx, ty + 26.5*f*k, 0, 'left'); }
      } else if (b.t === 'salad') {
        saladRow(c, b.sl, yy, k);
      } else if (b.t === 'closing') {
        const s = fit(c, SONG, 40*k, d.closing, .1, CW);
        c.fillStyle = C.seal; drawSpaced(c, d.closing, W/2, yy + 26.5*k, s*.1);
      }
      y += b.h*k;
    });
    return { k };
  }

  async function ensureFonts(d) {
    if (!document.fonts || !document.fonts.load) return;
    const song = [d.mainsTitle, d.sidesTitle, d.soupTitle, d.closing, ...d.mains, ...d.soups, '제주'].join('') || '가';
    const brush = d.title || '가';
    const b7 = [...d.sides, d.salad, d.salad ? SALAD : ''].join('') || '가';
    const b4 = [d.greet, d.soupSub, d.salad, d.salad ? SALAD + '·' : ''].join('') || '가';
    try {
      await Promise.all([
        document.fonts.load(SONG(40), song),
        document.fonts.load(BRUSH(40), brush),
        document.fonts.load(BAT7(40), b7),
        document.fonts.load(BAT4(40), b4)
      ]);
    } catch (e) {}
  }

  // ---------- 미리보기 ----------
  const pv = $('pv'), note = $('note');
  let seq = 0, timer = null;
  async function renderPreview() {
    const my = ++seq, d = model();
    await ensureFonts(d);
    if (my !== seq) return;
    const { k } = draw(pv.getContext('2d'), 1, d);
    note.textContent = k < 0.9 ? '메뉴가 많아서 글씨를 조금 줄였어요.' : '';
    schedulePrebuild();
  }
  function onChange() { persist(); syncChips(); clearTimeout(timer); timer = setTimeout(renderPreview, 120); }
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => { clearTimeout(timer); timer = setTimeout(renderPreview, 60); });

  // ---------- 저장 · 공유 ----------
  const btnPng = $('save-png'), btnPdf = $('save-pdf'), statusEl = $('status');
  const hasPdf = !!(window.jspdf && window.jspdf.jsPDF);
  if (!hasPdf) { btnPdf.hidden = true; $('actions').classList.add('single'); }
  const setStatus = t => { statusEl.textContent = t; };
  const canShareFiles = (() => {
    try {
      const f = new File([new Blob(['x'], { type: 'image/png' })], 'test.png', { type: 'image/png' });
      return !!(window.isSecureContext && navigator.canShare && navigator.share && navigator.canShare({ files: [f] }));
    } catch (e) { return false; }
  })();
  // 가운데 점 앞뒤(\u2060)로는 줄을 나누지 않아 폰에서는 '이미지 / 저장·공유'로만 나뉨
  if (canShareFiles) { btnPng.textContent = '이미지 저장\u2060·\u2060공유'; $('share-hint').hidden = false; }

  const baseName = () => {
    const now = new Date();
    const ds = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    const t = (state.title.trim() || '메뉴판').replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '_');
    return `${t}_${ds}`;
  };
  let busy = false;
  const setBusy = v => { busy = v; btnPng.disabled = v; btnPdf.disabled = v; };

  // 같은 내용이면 이미 만든 파일을 재사용
  let cache = { key: '', png: null, pdf: null };
  const keyOf = d => JSON.stringify(d);
  const toBlob = (cv, type) => new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('blob')), type));
  async function build(kind, d) {
    await ensureFonts(d);
    const ex = document.createElement('canvas'); ex.width = W*2; ex.height = H*2;
    draw(ex.getContext('2d'), 2, d);
    if (kind === 'png') return toBlob(ex, 'image/png');
    const pdf = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
    pdf.addImage(ex.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 210, 297);
    return pdf.output('blob');
  }
  async function getFile(kind) {
    const d = model(), key = keyOf(d);
    if (cache.key !== key) cache = { key, png: null, pdf: null };
    if (cache[kind]) return cache[kind];
    const blob = await build(kind, d);
    if (cache.key === key) cache[kind] = blob;
    return blob;
  }
  // 휴대폰에서는 입력이 멈추면 이미지를 미리 만들어 둬서, 버튼을 누르자마자 공유 창이 뜨게 함
  let prebuildTimer = null;
  function schedulePrebuild() {
    if (!canShareFiles) return;
    clearTimeout(prebuildTimer);
    prebuildTimer = setTimeout(() => { if (!busy) getFile('png').catch(() => {}); }, 900);
  }

  function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  async function save(kind) {
    if (busy) return;
    refreshDate();
    const name = baseName() + (kind === 'png' ? '.png' : '.pdf');
    const type = kind === 'png' ? 'image/png' : 'application/pdf';
    const key = keyOf(model());
    let blob = (cache.key === key && cache[kind]) || null;
    if (!blob) {
      setBusy(true); setStatus('파일을 만드는 중이에요…');
      try { blob = await getFile(kind); }
      catch (e) { setBusy(false); setStatus('파일을 만들지 못했어요. 다시 눌러 주세요.'); return; }
      setBusy(false);
    }
    const file = new File([blob], name, { type });
    if (canShareFiles && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); setStatus(''); return; }
      catch (e) {
        if (e && e.name === 'AbortError') { setStatus(''); return; }
        if (e && e.name === 'NotAllowedError') { setStatus('파일이 준비됐어요. 버튼을 한 번 더 눌러 주세요.'); return; }
      }
    }
    download(blob, name);
    setStatus('저장했어요. 다운로드 폴더를 확인하세요.');
  }
  btnPng.addEventListener('click', () => save('png'));
  btnPdf.addEventListener('click', () => save('pdf'));

  // ---------- 시작 ----------
  // 켜 둔 채 날짜가 바뀌어도 (홈 화면 앱은 새로 열지 않고 이어서 열림) 지난 날짜면 오늘로
  function refreshDate() {
    if (!staleDate(state.greet)) return;
    state.greet = today(); $('f-greet').value = state.greet; onChange();
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshDate(); });
  window.addEventListener('pageshow', refreshDate);
  window.addEventListener('focus', refreshDate);
  setInterval(refreshDate, 60000);
  areas.forEach(autoGrow);
  syncChips();
  syncSizes();
  renderPreview();
})();
</script>
</body>
</html>
